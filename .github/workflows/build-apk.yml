name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Pruebas unitarias
        run: gradle testDebugUnitTest --stacktrace

      - name: Compilar APK (debug)
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mi-vida-en-una-cuadricula-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar APK en Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MiVidaEnUnaCuadricula.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MiVidaEnUnaCuadricula.apk \
            --title "APK más reciente" \
            --notes "APK de depuración compilado desde el commit ${GITHUB_SHA::7}. Descárgalo e instálalo en Android 8.0 o superior (permite instalar apps de origen desconocido)." \
            --target "$GITHUB_SHA" \
            --latest
